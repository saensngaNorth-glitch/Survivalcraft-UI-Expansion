name: Build Survivalcraft UI Expansion

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore UIExpansion.csproj

      - name: Build
        run: dotnet build UIExpansion.csproj -c Release --no-restore

      - name: Package SCMod
        shell: bash
        run: |
          mkdir -p package/Assets
          cp modinfo.json package/
          cp -r Assets/* package/Assets/
          cp bin/Release/net10.0/UIExpansion.dll package/

          cd package
          zip -r ../UIExpansion_v0.3.scmod .

      - name: Upload SCMod
        uses: actions/upload-artifact@v4
        with:
          name: UIExpansion_v0.3
          path: UIExpansion_v0.3.scmod
