name: Build Survivalcraft UI Expansion

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore UIExpansion.csproj

      - name: Build
        run: dotnet build UIExpansion.csproj --configuration Release --no-restore

      - name: Prepare SCMod package
        shell: bash
        run: |
          set -e
          rm -rf package
          mkdir -p package/Assets
          cp modinfo.json package/modinfo.json
          cp -r Assets/. package/Assets/
          cp bin/Release/net10.0/UIExpansion.dll package/UIExpansion.dll

      - name: Create SCMod
        shell: bash
        run: |
          cd package
          zip -r ../UIExpansion_v0.3.scmod .

      - name: Upload SCMod
        uses: actions/upload-artifact@v4
        with:
          name: UIExpansion_v0.3
          path: UIExpansion_v0.3.scmod
          if-no-files-found: error
